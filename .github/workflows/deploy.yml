name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS Ubuntu Server
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar comandos de despliegue vía SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /var/www/www.distribuidoratridente.cl
            git fetch origin main
            git reset --hard origin/main

            # ── Inyectar variables de Evolution API al .env del backend ──
            ENV_FILE="/var/www/www.distribuidoratridente.cl/backend/.env"
            inject_env() {
              local key="$1"
              local value="$2"
              if [ -n "$value" ]; then
                if grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
                  sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
                else
                  echo "${key}=${value}" >> "$ENV_FILE"
                fi
              fi
            }
            inject_env "EVOLUTION_API_URL"         "${{ secrets.EVOLUTION_API_URL }}"
            inject_env "EVOLUTION_API_GLOBAL_KEY"  "${{ secrets.EVOLUTION_API_GLOBAL_KEY }}"
            inject_env "WHATSAPP_INSTANCE_NAME"    "${{ secrets.WHATSAPP_INSTANCE_NAME }}"

            cd deploy
            bash deploy.sh
