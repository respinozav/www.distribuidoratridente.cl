# =============================================================================
# Nginx Configuration: camila.distribuidoratridente.cl
# Proxy inverso para el backend FastAPI de Camila AI (puerto 8015)
# Copiar a /etc/nginx/sites-available/camila.distribuidoratridente.cl
# y crear enlace simbólico en /etc/nginx/sites-enabled/
# =============================================================================

server {
    listen 80;
    server_name camila.distribuidoratridente.cl;

    location / {
        proxy_pass http://127.0.0.1:8015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
