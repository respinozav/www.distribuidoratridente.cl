<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cotizaciones Mayoristas | Distribuidora Tridente</title>
  <meta http-equiv="refresh" content="3;url=index.html" />
  <link rel="stylesheet" href="css/styles.css?v=2.3" />
  <style>
    .redirect-box {
      max-width: 580px;
      margin: 80px auto;
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    .redirect-badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 6px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .redirect-title {
      font-size: 24px;
      color: #0f172a;
      margin: 0 0 14px;
      font-weight: 800;
    }
    .redirect-desc {
      font-size: 15px;
      color: #475569;
      line-height: 1.6;
      margin: 0 0 28px;
    }
    .redirect-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
  </style>
</head>
<body style="background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <div class="container">
    <div class="redirect-box">
      <div class="redirect-badge">✨ Nueva Modalidad de Atención</div>
      <h1 class="redirect-title">Cotizaciones Formales con Camila</h1>
      <p class="redirect-desc">
        Por políticas comerciales mayoristas, las cotizaciones formales valorizadas ahora son generadas directamente por <strong>Camila</strong> y enviadas a su correo electrónico.
      </p>
      <div class="redirect-actions">
        <a href="index.html" class="btn btn-primary" style="width: 100%; max-width: 320px;">
          Ir al Inicio y Cotizar con Camila
        </a>
        <a href="https://pedidos.distribuidoratridente.cl/Public/Catalogo" target="_blank" rel="noopener" class="btn btn-secondary" style="width: 100%; max-width: 320px;">
          Ver Catálogo Completo
        </a>
      </div>
    </div>
  </div>

  <script src="js/camila-widget.js?v=2.3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (window.Camila) {
          window.Camila.openChat('Hola Camila, quisiera armar una cotización por correo.');
        }
      }, 800);
    });
  </script>
</body>
</html>
